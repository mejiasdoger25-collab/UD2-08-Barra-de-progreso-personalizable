<div class="progress" role="progressbar" aria-label="Sample" [attr.aria-valuenow]="barValor()" aria-valuemin="0"
    aria-valuemax="100">
    <div class="progress-bar" [class]="barColor()" [style.width.%]="barValor()"></div>
</div>

<div class="card-body form-field">
    <div class="mb-3">
        <label for="fieldValor" class="form-label">Valor</label>
        <input type="text" class="form-control" id="fieldValor" placeholder="Indique su valor..." [ngModel]="valor()"
            (ngModelChange)="valor.set($event)">
    </div>
    <div class="mb-3">
        <label for="fieldColor" class="form-label">Color</label>
        <select class="form-select" id="fieldColor" [ngModel]="color()" (ngModelChange)="color.set($event)">+
            <option value="" disabled selected>Selecciona una opción...</option>
            <option value="Rojo">Rojo</option>
            <option value="Verde">Verde</option>
            <option value="Amarillo">Amarillo</option>
        </select>
    </div>
</div>

<button type="button" (click)="updateBar()" class="btn btn-primary w-100 theme-primary btn-solid btn-styled">
    Actualizar bar
</button>
